version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; upgrade both together.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node types follow the Node version pinned in .nvmrc (24), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      playwright:
        patterns:
          - '@playwright/*'
          - 'playwright'
          - 'playwright-core'
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
